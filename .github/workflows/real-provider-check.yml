name: Project 9 Real Provider Check

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which check to run"
        required: true
        default: "real_provider_check.py"
        type: choice
        options:
          - real_provider_check.py
          - e2e_ai_routing_check.py
      core_ref:
        description: "Private Core git ref (commit/tag/branch)"
        required: false
        default: "main"
        type: string
      model_id:
        description: "Only for real_provider_check.py: test only this model id (leave empty for all)"
        required: false
        default: ""
        type: string

# Critical security rule:
# No push/pull_request triggers.
permissions:
  contents: read

jobs:
  real-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6

      - name: Checkout private Project 9 Core
        uses: actions/checkout@v6
        with:
          repository: ahmed4kk/project-9-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.PROJECT9_CORE_READ_TOKEN }}
          path: project9-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Core dependencies
        working-directory: project9-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check
        working-directory: project9-core
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT: ${{ inputs.script }}
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          python scripts/$SCRIPT $MODEL_ID
