name: Project 9 Core Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Existing Project 9 task ID"
        required: true
        type: string
      core_ref:
        description: "Private Core git ref (commit/tag/branch)"
        required: false
        default: "main"
        type: string

# Critical security rule: no push/pull_request triggers.
permissions:
  contents: read

jobs:
  run-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6

      - name: Checkout private Project 9 Core
        uses: actions/checkout@v6
        with:
          repository: ahmed4kk/project-9-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.PROJECT9_CORE_READ_TOKEN }}
          path: project9-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Core
        working-directory: project9-core
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Core task
        env:
          TASK_ID: ${{ inputs.task_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.BUSINESS4K_PUBLISH_TOKEN }}
        run: |
          cd project9-core
          python -m lotus.runtime.runner --task-id "$TASK_ID"
