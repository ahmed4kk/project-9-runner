name: Project 9 API Test Suite

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Existing Project 9 task ID (not used during API tests)"
        required: false
        default: ""
        type: string

      core_ref:
        description: "Private Core git ref (commit/tag/branch)"
        required: false
        default: "main"
        type: string

# Critical security rule:
# No push/pull_request triggers.
permissions:
  contents: read

jobs:
  test-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout public runner
        uses: actions/checkout@v6

      - name: Checkout private Project 9 Core
        uses: actions/checkout@v6
        with:
          repository: ahmed4kk/project-9-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.PROJECT9_CORE_READ_TOKEN }}
          path: project9-core
          persist-credentials: false

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Core dependencies
        working-directory: project9-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check Project 9 model system
        working-directory: project9-core
        run: |
          python -m py_compile lotus/models/quota_manager.py
          python -m py_compile lotus/models/quota_store.py
          python -m py_compile lotus/models/registry.py
          python -m py_compile lotus/models/router.py

          echo "Project 9 model system compile check OK"
      # ============================================================
      # PYTHON COMPILE CHECK
      # ============================================================

      - name: Compile check Project 9 model system
        working-directory: project9-core
        run: |
          python -m py_compile lotus/models/quota_manager.py
          python -m py_compile lotus/models/quota_store.py
          python -m py_compile lotus/models/registry.py
          python -m py_compile lotus/models/router.py

          echo "======================================"
          echo "Project 9 model system compile check OK"
          echo "======================================"

      # ============================================================
      # GEMINI
      # ============================================================

      - name: Test Gemini API
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ.get("GOOGLE_API_KEY", "").strip()

          print("===== GEMINI 3.6 FLASH =====")
          print("Secret present:", bool(api_key))

          if not api_key:
              raise RuntimeError("GOOGLE_API_KEY is empty")

          response = requests.post(
              "https://generativelanguage.googleapis.com/v1beta/interactions",
              headers={
                  "x-goog-api-key": api_key,
                  "Content-Type": "application/json",
              },
              json={
                  "model": "gemini-3.6-flash",
                  "input": "Reply with exactly: Project 9 Gemini test OK",
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # GROQ
      # ============================================================

      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ.get("GROQ_API_KEY", "").strip()

          print("===== GROQ GPT-OSS 120B =====")
          print("Secret present:", bool(api_key))

          if not api_key:
              raise RuntimeError("GROQ_API_KEY is empty")

          response = requests.post(
              "https://api.groq.com/openai/v1/chat/completions",
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
              },
              json={
                  "model": "openai/gpt-oss-120b",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Groq test OK",
                      }
                  ],
                  "max_tokens": 30,
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # OPENROUTER
      # ============================================================

      - name: Test OpenRouter Free API
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ.get("OPENROUTER_API_KEY", "").strip()

          print("===== OPENROUTER FREE =====")
          print("Secret present:", bool(api_key))

          if not api_key:
              raise RuntimeError("OPENROUTER_API_KEY is empty")

          response = requests.post(
              "https://openrouter.ai/api/v1/chat/completions",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "model": "openrouter/free",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 OpenRouter test OK",
                      }
                  ],
                  "max_tokens": 30,
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # NVIDIA / DEEPSEEK
      # ============================================================

      - name: Test NVIDIA DeepSeek V4 Flash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ.get("NVIDIA_API_KEY", "").strip()

          print("===== NVIDIA DEEPSEEK V4 FLASH =====")
          print("Secret present:", bool(api_key))

          if not api_key:
              raise RuntimeError("NVIDIA_API_KEY is empty")

          response = requests.post(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
              },
              json={
                  "model": "deepseek-ai/deepseek-v4-flash-0731",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 NVIDIA DeepSeek test OK",
                      }
                  ],
                  "max_tokens": 30,
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # CLOUDFLARE WORKERS AI
      # ============================================================

      - name: Test Cloudflare Workers AI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()

          print("===== CLOUDFLARE WORKERS AI =====")
          print("Token present:", bool(token))
          print("Account ID present:", bool(account_id))

          if not token:
              raise RuntimeError("CLOUDFLARE_API_TOKEN is empty")

          if not account_id:
              raise RuntimeError("CLOUDFLARE_ACCOUNT_ID is empty")

          model = "@cf/zai-org/glm-4.7-flash"

          url = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/ai/run/{model}"
          )

          response = requests.post(
              url,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
              json={
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Cloudflare test OK",
                      }
                  ]
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: API test summary
        run: |
          echo "======================================"
          echo "Project 9 API test suite completed."
          echo ""
          echo "Active providers tested:"
          echo "- Google / Gemini 3.6 Flash"
          echo "- Groq / GPT-OSS 120B"
          echo "- OpenRouter / Free"
          echo "- NVIDIA / DeepSeek V4 Flash"
          echo "- Cloudflare Workers AI"
          echo ""
          echo "Excluded from active pool:"
          echo "- Mistral"
          echo "- Cerebras"
          echo ""
          echo "No Project 9 Core task was executed."
          echo "No Research workflow was executed."
          echo "No legacy AI worker was executed."
          echo "No models.yaml changes were made."
          echo "======================================"
