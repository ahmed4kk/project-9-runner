name: Project 9 Core Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Existing Project 9 task ID"
        required: true
        type: string
      core_ref:
        description: "Private Core git ref (commit/tag/branch)"
        required: false
        default: "main"
        type: string

# Critical security rule: no push/pull_request triggers.
permissions:
  contents: read

jobs:
  run-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6

      - name: Checkout private Project 9 Core
        uses: actions/checkout@v6
        with:
          repository: ahmed4kk/project-9-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.PROJECT9_CORE_READ_TOKEN }}
          path: project9-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Core
        working-directory: project9-core
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Test Cloudflare Workers AI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]

          url = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              json={
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Cloudflare test OK"
                      }
                  ]
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      - name: Run Core task
        env:
          TASK_ID: ${{ inputs.task_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.BUSINESS4K_PUBLISH_TOKEN }}
        run: |
          cd project9-core
          python -c "from lotus.runtime.execution import execute_task; print(execute_task('$TASK_ID'))"
