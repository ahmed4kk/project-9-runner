name: Project 9 API Test Suite

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Existing Project 9 task ID (not used during API tests)"
        required: false
        default: ""
        type: string
      core_ref:
        description: "Private Core git ref (commit/tag/branch)"
        required: false
        default: "main"
        type: string

# Critical security rule: no push/pull_request triggers.
permissions:
  contents: read

jobs:
  test-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6

      - name: Checkout private Project 9 Core
        uses: actions/checkout@v6
        with:
          repository: ahmed4kk/project-9-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.PROJECT9_CORE_READ_TOKEN }}
          path: project9-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Core dependencies
        working-directory: project9-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # GEMINI
      # ============================================================
      - name: Test Gemini API
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["GOOGLE_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent"
          )

          response = requests.post(
              url,
              params={"key": api_key},
              headers={"Content-Type": "application/json"},
              json={
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": "Reply with exactly: Project 9 Gemini test OK"
                              }
                          ]
                      }
                  ]
              },
              timeout=60,
          )

          print("===== GEMINI =====")
          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # GROQ
      # ============================================================
      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["GROQ_API_KEY"]

          url = "https://api.groq.com/openai/v1/chat/completions"

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "model": "llama-3.3-70b-versatile",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Groq test OK"
                      }
                  ],
                  "max_tokens": 20,
              },
              timeout=60,
          )

          print("===== GROQ =====")
          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # OPENROUTER
      # ============================================================
      - name: Test OpenRouter API
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["OPENROUTER_API_KEY"]

          url = "https://openrouter.ai/api/v1/chat/completions"

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "model": "openrouter/free",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 OpenRouter test OK"
                      }
                  ],
                  "max_tokens": 30,
              },
              timeout=60,
          )

          print("===== OPENROUTER =====")
          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # CEREBRAS
      # ============================================================
      - name: Test Cerebras API
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["CEREBRAS_API_KEY"]

          url = "https://api.cerebras.ai/v1/chat/completions"

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "model": "llama-3.3-70b",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Cerebras test OK"
                      }
                  ],
                  "max_tokens": 20,
              },
              timeout=60,
          )

          print("===== CEREBRAS =====")
          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # NVIDIA
      # ============================================================
     
      - name: Test NVIDIA API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          raw_key = os.environ.get("NVIDIA_API_KEY", "")
          api_key = raw_key.strip()

          print("===== NVIDIA =====")
          print("Secret present:", bool(api_key))
          print("Secret length:", len(api_key))

          if not api_key:
              raise RuntimeError("NVIDIA_API_KEY is empty")

          if any(ch.isspace() for ch in api_key):
              raise RuntimeError(
                  "NVIDIA_API_KEY contains whitespace inside the key"
              )

          url = "https://integrate.api.nvidia.com/v1/chat/completions"

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "model": "meta/llama-3.3-70b-instruct",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 NVIDIA test OK"
                      }
                  ],
                  "max_tokens": 20,
              },
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # CLOUDFLARE WORKERS AI
      # ============================================================
      - name: Test Cloudflare Workers AI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]

          url = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              json={
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Cloudflare test OK"
                      }
                  ]
              },
              timeout=60,
          )

          print("===== CLOUDFLARE =====")
          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # MISTRAL
      # ============================================================
      - name: Test Mistral API
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["MISTRAL_API_KEY"]

          url = "https://api.mistral.ai/v1/chat/completions"

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "model": "mistral-small-latest",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly: Project 9 Mistral test OK"
                      }
                  ],
                  "max_tokens": 20,
              },
              timeout=60,
          )

          print("===== MISTRAL =====")
          print("HTTP STATUS:", response.status_code)
          print(response.text)

          response.raise_for_status()
          PY

      # ============================================================
      # FINAL NOTE
      # ============================================================
      - name: API test summary
        run: |
          echo "======================================"
          echo "Project 9 API test suite completed."
          echo "Check each previous step for its HTTP status."
          echo "No Project 9 Core task was executed."
          echo "No models.yaml changes were made."
          echo "======================================"
